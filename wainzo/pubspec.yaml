name: wainzo
description: "Wainzo — creators choose where their content is seen, AI explains it, the viewer decides."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # State management and navigation.
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # The watch experience and the composer's media step.
  video_player: ^2.14.0
  image_picker: ^1.2.3

  # The data layer's transport, and on-device persistence for drafts,
  # the session and the feedback signals that feed ranking.
  http: ^1.6.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Lets tests swap in an in-memory key/value store instead of a device one.
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/media/

  fonts:
    # Inter carries the interface.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
    # Instrument Serif carries the editorial voice: the AI's own words,
    # country names, and the figures that lead a screen.
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif_400Regular.ttf
          weight: 400
